<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Interactive JavaScript To-Do List Application">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>My To-Do List</h1>
            <p>Manage your daily tasks easily</p>
        </header>


        <!-- Add Task Section -->
        <section class="task-input">

            <label for="taskInput" class="sr-only">
                Enter a new task
            </label>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                autocomplete="off"
            >

            <button id="addTaskBtn" type="button">
                Add Task
            </button>

        </section>


        <!-- Filter Buttons -->
        <nav class="filters" aria-label="Task filters">

            <button
                class="filter-btn active"
                data-filter="all">
                All
            </button>

            <button
                class="filter-btn"
                data-filter="active">
                Active
            </button>

            <button
                class="filter-btn"
                data-filter="completed">
                Completed
            </button>

        </nav>


        <!-- Task List -->
        <section aria-labelledby="task-heading">

            <h2 id="task-heading" class="sr-only">
                Task List
            </h2>

            <ul id="taskList"></ul>

            <p id="emptyMessage">
                No tasks available.
            </p>

        </section>


        <!-- Task Statistics -->
        <footer class="task-footer">

            <span id="taskCount">
                0 tasks remaining
            </span>

            <button id="clearCompleted" type="button">
                Clear Completed
            </button>

        </footer>

    </main>


    <script src="js/script.js"></script>

</body>
</html>
